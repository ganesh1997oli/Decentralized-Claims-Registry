name: Continuous integration

on:
  pull_request:
  push:
    branches:
      - main
      - "feature/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python unit and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            backend/requirements.txt
            integrations/**/requirements.txt
            listener/requirements.txt
            model/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.txt
      - name: Run Python correctness lint
        run: >-
          ruff check --select E4,E7,E9,F
          backend duplicates integrations listener model
          --exclude model/notebooks
      - name: Run isolated tests with branch coverage
        run: >-
          python -m pytest -m "not integration"
          --cov=backend.app
          --cov=duplicates
          --cov=integrations.ipfs
          --cov=integrations.kafka
          --cov=integrations.postgres
          --cov=listener.block_cursor
          --cov=listener.claims_listener
          --cov=model.xgboost_scorer
          --cov-report=term-missing

  integration:
    name: Kafka and PostgreSQL integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.txt
      - name: Start isolated infrastructure
        run: |
          docker compose -f integrations/kafka/compose.yml up -d --wait postgres kafka
          docker compose -f integrations/kafka/compose.yml run --rm kafka-init
      - name: Run infrastructure-backed tests
        env:
          TEST_DATABASE_URL: postgresql://claims:claims-local@127.0.0.1:5432/claims_registry
          TEST_KAFKA_BOOTSTRAP_SERVERS: 127.0.0.1:9092
        run: python -m pytest -m integration
      - name: Show service logs after a failure
        if: failure()
        run: docker compose -f integrations/kafka/compose.yml logs --no-color
      - name: Remove test infrastructure
        if: always()
        run: docker compose -f integrations/kafka/compose.yml down --volumes

  frontend:
    name: Frontend unit, build, and browser
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
          package-manager-cache: true
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  contract:
    name: Smart contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: contract
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: contract/package-lock.json
          package-manager-cache: true
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npx hardhat test
      - run: npx hardhat build --build-profile production
