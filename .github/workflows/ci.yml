name: Continuous integration

on:
  pull_request:
  push:
    branches: ["**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-locks:
    name: Python dependency locks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      # Pin the action itself as well as uv so dependency resolution cannot
      # change merely because an upstream tag moved.
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.9.20"
          enable-cache: true
          cache-dependency-glob: "requirements*.lock"
      - name: Rebuild locks and reject dependency drift
        run: |
          uv pip compile infrastructure/gcp/python-requirements.txt \
            --python-version 3.13 \
            --python-platform x86_64-manylinux_2_28 \
            --generate-hashes \
            --custom-compile-command 'uv pip compile infrastructure/gcp/python-requirements.txt --python-version 3.13 --python-platform x86_64-manylinux_2_28 --generate-hashes -o requirements.lock' \
            -o requirements.lock
          uv pip compile requirements-dev.txt \
            --python-version 3.13 \
            --python-platform x86_64-manylinux_2_28 \
            --generate-hashes \
            --custom-compile-command 'uv pip compile requirements-dev.txt --python-version 3.13 --python-platform x86_64-manylinux_2_28 --generate-hashes -o requirements-dev.lock' \
            -o requirements-dev.lock
          git diff --exit-code -- requirements.lock requirements-dev.lock

  python:
    name: Python unit and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: python -m pip install --require-hashes -r requirements-dev.lock
      - name: Run Python lint
        run: >-
          ruff check apps packages infrastructure/gcp/tests
          --exclude packages/model/notebooks
      - name: Run isolated tests with branch coverage
        run: >-
          python -m pytest -m "not integration"
          --cov=apps.backend.app
          --cov=apps.listener.block_cursor
          --cov=apps.listener.claims_listener
          --cov=apps.relayer
          --cov=packages.duplicates
          --cov=packages.integrations.ipfs
          --cov=packages.integrations.kafka
          --cov=packages.integrations.postgres
          --cov=packages.model.xgboost_scorer
          --cov=packages.observability
          --cov-report=term-missing

  integration:
    name: Kafka and PostgreSQL integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: python -m pip install --require-hashes -r requirements-dev.lock
      - name: Start isolated infrastructure
        run: |
          docker compose -f packages/integrations/kafka/compose.yml up -d --wait postgres kafka
          docker compose -f packages/integrations/kafka/compose.yml run --rm kafka-init
      - name: Run infrastructure-backed tests
        env:
          TEST_DATABASE_URL: postgresql://claims:claims-local@127.0.0.1:5432/claims_registry
          TEST_KAFKA_BOOTSTRAP_SERVERS: 127.0.0.1:9092
        run: python -m pytest -m integration
      - name: Exercise the production migration command
        env:
          DATABASE_URL: postgresql://claims:claims-local@127.0.0.1:5432/claims_registry
        run: |
          python -m packages.integrations.postgres.migrations upgrade
          python -m packages.integrations.postgres.migrations check
      - name: Show service logs after a failure
        if: failure()
        run: docker compose -f packages/integrations/kafka/compose.yml logs --no-color
      - name: Remove test infrastructure
        if: always()
        run: docker compose -f packages/integrations/kafka/compose.yml down --volumes

  frontend:
    name: Frontend unit, build, and browser
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
          package-manager-cache: true
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  contract:
    name: Smart contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/contracts
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/contracts/package-lock.json
          package-manager-cache: true
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npx hardhat test
      - run: npx hardhat build --build-profile production

  cloud-deployment:
    name: Google Cloud deployment configuration
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6

      - name: Build and smoke-test the production images
        run: |
          docker build \
            --file infrastructure/gcp/Dockerfile.app \
            --tag decentralized-claims-app:ci \
            .
          docker run --rm \
            --entrypoint python \
            decentralized-claims-app:ci \
            -c "import apps.relayer.gasless_relayer; from packages.integrations.ethereum.deployment import load_claims_deployment; deployment = load_claims_deployment({'CLAIMS_DEPLOYMENT_ID': 'sepolia-public-intake-v1'}); deployment.require_public_intake()"
          docker build \
            --file infrastructure/gcp/Dockerfile.frontend \
            --tag decentralized-claims-frontend:ci \
            .

      # Compose needs the referenced file to exist while resolving services.
      # Placeholder values are safe here because no containers are started.
      - name: Validate the single-VM Compose model
        run: |
          cp infrastructure/gcp/.env.gcp.example infrastructure/gcp/.env.gcp
          docker compose \
            --env-file infrastructure/gcp/.env.gcp \
            --file infrastructure/gcp/compose.yml \
            --profile training \
            config --quiet

      # The official Terraform image keeps the runner setup small. Init only
      # downloads the locked Google provider; validate never creates cloud state.
      - name: Validate the Compute Engine infrastructure
        run: |
          docker run --rm \
            -v "$PWD/infrastructure/gcp:/workspace" \
            -w /workspace/terraform \
            hashicorp/terraform:1.13.5 fmt -check -recursive
          docker run --rm \
            -v "$PWD/infrastructure/gcp:/workspace" \
            -w /workspace/terraform \
            hashicorp/terraform:1.13.5 init -backend=false
          docker run --rm \
            -v "$PWD/infrastructure/gcp:/workspace" \
            -w /workspace/terraform \
            hashicorp/terraform:1.13.5 validate
