# Nginx gives the static React build one public entry point and keeps every
# Python, database, Kafka and monitoring port on the VM's private side.
server {
    listen 8080;
    server_name _;

    # The frontend image copies Vite's finished website into this directory.
    # Declaring it explicitly matters because this file replaces Nginx's
    # packaged default server, which is where the usual document root lived.
    root /usr/share/nginx/html;
    index index.html;

    # Small defensive headers are appropriate even for fictional research data.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    # The VM and Docker health checks use this lightweight endpoint.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # A trailing slash on proxy_pass intentionally removes the public /api/
    # prefix. For example, /api/claims becomes FastAPI's /claims route.
    location /api/ {
        # Reject unexpectedly large claim documents before they reach Python.
        # FastAPI applies the same limit when reached without this proxy.
        client_max_body_size 16k;
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Replace any client-supplied forwarding chain so Uvicorn's trusted
        # proxy handling cannot be used to evade the per-IP submission limit.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 240s;
    }

    # Vite creates hashed static assets. These can be cached for a long time,
    # while index.html must remain fresh enough to point at the latest hashes.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # React owns browser-side routes, so unknown paths fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
