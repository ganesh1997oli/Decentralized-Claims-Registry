# One-VM research deployment for the dissertation.
#
# This favours a reproducible, affordable demonstration over high
# availability. Kafka and PostgreSQL each have one node and must not be described
# as a production cluster.
name: ${COMPOSE_PROJECT_NAME:-decentralized-claims-cloud}

x-json-logging: &json-logging
  # Docker stores bounded JSON log files. The Google Ops Agent reads these files
  # and sends them to Cloud Logging without allowing logs to fill the VM disk.
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# These maps make each process receive only the settings it actually uses.
# Keeping them separate is a simple form of least privilege even on one VM.
x-chain-read-environment: &chain-read-environment
  SEPOLIA_RPC_URL: ${SEPOLIA_RPC_URL:?Set SEPOLIA_RPC_URL in .env.gcp}
  CLAIMS_DEPLOYMENT_ID: ${CLAIMS_DEPLOYMENT_ID:?Set CLAIMS_DEPLOYMENT_ID in .env.gcp}
  RECEIPT_TIMEOUT: ${RECEIPT_TIMEOUT:-180}

# The listener and scoring worker both inherit this map. Keeping one shared
# topic/group identity ensures the producer, consumer, and monitoring exporter
# all refer to the same contract deployment.
x-kafka-environment: &kafka-environment
  KAFKA_ENABLED: ${KAFKA_ENABLED:-true}
  KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
  KAFKA_CLAIM_SUBMITTED_TOPIC: ${KAFKA_CLAIM_SUBMITTED_TOPIC:-claims.submitted.sepolia-public-intake-v1}
  KAFKA_CLIENT_ID: ${KAFKA_CLIENT_ID:-claims-registry-cloud}
  KAFKA_CONSUMER_GROUP_ID: ${KAFKA_CONSUMER_GROUP_ID:-claims-registry-scorer-sepolia-public-intake-v1}
  KAFKA_DELIVERY_TIMEOUT_MS: ${KAFKA_DELIVERY_TIMEOUT_MS:-30000}
  KAFKA_CONSUMER_POLL_SECONDS: ${KAFKA_CONSUMER_POLL_SECONDS:-1}
  KAFKA_SECURITY_PROTOCOL: ${KAFKA_SECURITY_PROTOCOL:-PLAINTEXT}
  KAFKA_SASL_MECHANISM: ${KAFKA_SASL_MECHANISM:-}
  KAFKA_SASL_USERNAME: ${KAFKA_SASL_USERNAME:-}
  KAFKA_SASL_PASSWORD: ${KAFKA_SASL_PASSWORD:-}

x-python-service: &python-service
  image: decentralized-claims-app:local
  build:
    context: ../..
    dockerfile: infrastructure/gcp/Dockerfile.app
  restart: unless-stopped
  init: true
  read_only: true
  tmpfs:
    - /tmp:size=256m,mode=1777
  security_opt:
    - no-new-privileges:true
  logging: *json-logging

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: claims_registry
      POSTGRES_USER: claims
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.gcp}
    volumes:
      - claims-postgres-data:/var/lib/postgresql/data
    # The port is useful for VM-local troubleshooting but cannot be reached from
    # another computer. Application containers use postgres:5432 internally.
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U claims -d claims_registry"]
      interval: 10s
      timeout: 5s
      retries: 20
    logging: *json-logging

  kafka:
    image: apache/kafka:4.2.0
    restart: unless-stopped
    environment:
      # KRaft combines one broker and one controller for this research VM.
      # Production would use replicated brokers in separate failure zones.
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:29093"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_LISTENERS: "CONTROLLER://:29093,PLAINTEXT://:9092"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: "1"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: "/var/lib/kafka/data"
      KAFKA_HEAP_OPTS: "-Xms512m -Xmx1g"
      CLUSTER_ID: "4L6g3nShT-eMCtK--X86sw"
    volumes:
      - claims-kafka-data:/var/lib/kafka/data
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    logging: *json-logging

  kafka-init:
    image: apache/kafka:4.2.0
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        # Auto-creation is disabled on the broker, so create the exact topic
        # selected for this deployment before either application process starts.
        /opt/kafka/bin/kafka-topics.sh \
          --bootstrap-server kafka:9092 \
          --create \
          --if-not-exists \
          --topic "${KAFKA_CLAIM_SUBMITTED_TOPIC:-claims.submitted.sepolia-public-intake-v1}" \
          --partitions 3 \
          --replication-factor 1 \
          --config cleanup.policy=delete \
          --config retention.ms=604800000
    logging: *json-logging

  # A one-off root container gives the non-root listener ownership of its
  # dead-letter volume. The block checkpoint itself lives in PostgreSQL.
  listener-state-init:
    image: alpine:3.22
    restart: "no"
    network_mode: none
    command: ["sh", "-c", "chown -R 10001:10001 /state"]
    volumes:
      - claims-listener-state:/state
    logging: *json-logging

  # The application image and scoring worker run as uid 10001 with a read-only
  # root filesystem. This one-off container grants that uid access only to the
  # dedicated dead-letter volume; it does not grant write access to the model.
  scoring-state-init:
    image: alpine:3.22
    restart: "no"
    network_mode: none
    command: ["sh", "-c", "chown -R 10001:10001 /state"]
    volumes:
      - claims-scoring-state:/state
    logging: *json-logging

  # Training is an explicit profile because it should happen only when a person
  # intends to create a reviewed artifact, not during every normal deployment.
  model-artifact-init:
    image: alpine:3.22
    profiles: ["training"]
    restart: "no"
    network_mode: none
    command: ["sh", "-c", "chown -R 10001:10001 /model"]
    volumes:
      - "${XGBOOST_MODEL_HOST_DIR:?Set XGBOOST_MODEL_HOST_DIR in .env.gcp}:/model"
    logging: *json-logging

  model-trainer:
    # This service does not read .env.gcp: model training needs no
    # wallet, Pinata token, database password or duplicate-fingerprint key.
    image: decentralized-claims-app:local
    build:
      context: ../..
      dockerfile: infrastructure/gcp/Dockerfile.app
    profiles: ["training"]
    restart: "no"
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    security_opt:
      - no-new-privileges:true
    command:
      - python
      - -m
      - packages.model.train_xgboost
      - --download
      # The container root is intentionally read-only. Download the pinned
      # dataset into the writable, size-bounded tmpfs instead of /app.
      - --dataset
      - /tmp/african_motor_claims.csv
      - --output-dir
      - /opt/claims-model
    depends_on:
      model-artifact-init:
        condition: service_completed_successfully
    volumes:
      - "${XGBOOST_MODEL_HOST_DIR:?Set XGBOOST_MODEL_HOST_DIR in .env.gcp}:/opt/claims-model"
    logging: *json-logging

  database-migrate:
    <<: *python-service
    # Schema changes run once, before any process can read or write claim data.
    # Keeping DDL out of request and Kafka paths avoids startup races and lets a
    # deployment fail without partially starting the application.
    restart: "no"
    command:
      - python
      - -m
      - packages.integrations.postgres.migrations
      - upgrade
    environment:
      DATABASE_URL: "postgresql://claims:${POSTGRES_PASSWORD}@postgres:5432/claims_registry"
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    <<: *python-service
    command:
      - uvicorn
      - apps.backend.app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --proxy-headers
      - --forwarded-allow-ips=*
    environment:
      <<: *chain-read-environment
      # Only the API uploads new claim documents, so only this service receives
      # the Pinata token.
      PINATA_JWT: ${PINATA_JWT:?Set PINATA_JWT in .env.gcp}
      IPFS_GATEWAY: ${IPFS_GATEWAY:-https://gateway.pinata.cloud/ipfs}
      FRONTEND_ORIGINS: ${FRONTEND_ORIGINS:?Set FRONTEND_ORIGINS in .env.gcp}
      CLAIMANT_AUTH_DOMAIN: ${CLAIMANT_AUTH_DOMAIN:?Set CLAIMANT_AUTH_DOMAIN in .env.gcp}
      CLAIMANT_AUTH_URI: ${CLAIMANT_AUTH_URI:?Set CLAIMANT_AUTH_URI in .env.gcp}
      CLAIMANT_SESSION_SIGNING_KEY: ${CLAIMANT_SESSION_SIGNING_KEY:?Set CLAIMANT_SESSION_SIGNING_KEY in .env.gcp}
      CLAIMANT_SUBJECT_KEY: ${CLAIMANT_SUBJECT_KEY:?Set CLAIMANT_SUBJECT_KEY in .env.gcp}
      CLAIMANT_AUTH_FINGERPRINT_KEY: ${CLAIMANT_AUTH_FINGERPRINT_KEY:?Set CLAIMANT_AUTH_FINGERPRINT_KEY in .env.gcp}
      CLAIMANT_CHALLENGE_TTL_SECONDS: ${CLAIMANT_CHALLENGE_TTL_SECONDS:-300}
      CLAIMANT_SESSION_TTL_SECONDS: ${CLAIMANT_SESSION_TTL_SECONDS:-900}
      CLAIMANT_AUTH_CLIENT_RATE_PER_MINUTE: ${CLAIMANT_AUTH_CLIENT_RATE_PER_MINUTE:-20}
      CLAIMANT_AUTH_WALLET_RATE_PER_MINUTE: ${CLAIMANT_AUTH_WALLET_RATE_PER_MINUTE:-5}
      CLAIMANT_RATE_LIMIT_PER_MINUTE: ${CLAIMANT_RATE_LIMIT_PER_MINUTE:-5}
      IP_RATE_LIMIT_PER_MINUTE: ${IP_RATE_LIMIT_PER_MINUTE:-20}
      ALLOW_RATE_LIMIT_BYPASS: ${ALLOW_RATE_LIMIT_BYPASS:-false}
      MAX_CLAIM_BODY_BYTES: ${MAX_CLAIM_BODY_BYTES:-16384}
      POLICY_REFERENCE_LOOKUP_KEY: ${POLICY_REFERENCE_LOOKUP_KEY:?Set POLICY_REFERENCE_LOOKUP_KEY in .env.gcp}
      CLAIMANT_COMMITMENT_KEY: ${CLAIMANT_COMMITMENT_KEY:?Set CLAIMANT_COMMITMENT_KEY in .env.gcp}
      POLICY_ELIGIBILITY_RECORDS_JSON: ${POLICY_ELIGIBILITY_RECORDS_JSON:?Set POLICY_ELIGIBILITY_RECORDS_JSON in .env.gcp}
      CLAIM_PERMIT_ISSUERS_JSON: ${CLAIM_PERMIT_ISSUERS_JSON:?Set CLAIM_PERMIT_ISSUERS_JSON in .env.gcp}
      CLAIM_AUTHORIZATION_KEY: ${CLAIM_AUTHORIZATION_KEY:?Set CLAIM_AUTHORIZATION_KEY in .env.gcp}
      GASLESS_REQUEST_FINGERPRINT_KEY: ${GASLESS_REQUEST_FINGERPRINT_KEY:?Set GASLESS_REQUEST_FINGERPRINT_KEY in .env.gcp}
      GASLESS_FORWARD_GAS: ${GASLESS_FORWARD_GAS:-250000}
      GASLESS_SIGNATURE_TTL_SECONDS: ${GASLESS_SIGNATURE_TTL_SECONDS:-600}
      PUBLIC_DEMO_READ_ONLY: ${PUBLIC_DEMO_READ_ONLY:-false}
      # This explicit prototype-only switch permits anonymous off-chain assessor
      # revisions. It grants no wallet or chain authority and defaults false.
      PUBLIC_PROTOTYPE_ASSESSOR: ${PUBLIC_PROTOTYPE_ASSESSOR:-false}
      INDEXER_OPERATIONS_API_KEY_SHA256: ${INDEXER_OPERATIONS_API_KEY_SHA256:?Set INDEXER_OPERATIONS_API_KEY_SHA256 in .env.gcp}
      INDEXER_STALE_AFTER_SECONDS: ${INDEXER_STALE_AFTER_SECONDS:-120}
      # Human reviewers use a separate digest-only identity. This value grants no
      # insurer submission, indexer operations, or Ethereum signing authority.
      ASSESSOR_OUTCOME_CREDENTIALS_JSON: ${ASSESSOR_OUTCOME_CREDENTIALS_JSON:?Set ASSESSOR_OUTCOME_CREDENTIALS_JSON in .env.gcp}
      CONFIRMATION_BLOCKS: ${CONFIRMATION_BLOCKS:-12}
      DATABASE_URL: "postgresql://claims:${POSTGRES_PASSWORD}@postgres:5432/claims_registry"
    depends_on:
      database-migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - "${CLAIM_PERMIT_ISSUER_KEYS_HOST_DIR:?Set CLAIM_PERMIT_ISSUER_KEYS_HOST_DIR in .env.gcp}:/run/secrets/permit-issuers:ro"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=10)"
      interval: 15s
      timeout: 5s
      retries: 10
    stop_grace_period: 240s

  gasless-relayer:
    <<: *python-service
    command: ["python", "-m", "apps.relayer.gasless_relayer"]
    environment:
      <<: *chain-read-environment
      # This dedicated account pays gas only. It must hold no registry role and
      # its balance should be capped and monitored independently.
      DEPLOYMENT_ENVIRONMENT: production
      SEPOLIA_RELAYER_PRIVATE_KEY_FILE: /run/secrets/relayer.key
      GASLESS_FORWARD_GAS: ${GASLESS_FORWARD_GAS:-250000}
      GASLESS_SIGNATURE_TTL_SECONDS: ${GASLESS_SIGNATURE_TTL_SECONDS:-600}
      GASLESS_MAX_TRANSACTION_GAS: ${GASLESS_MAX_TRANSACTION_GAS:-600000}
      GASLESS_MAX_FEE_GWEI: ${GASLESS_MAX_FEE_GWEI:-100}
      GASLESS_MAX_PRIORITY_FEE_GWEI: ${GASLESS_MAX_PRIORITY_FEE_GWEI:-3}
      GASLESS_RELAY_POLL_SECONDS: ${GASLESS_RELAY_POLL_SECONDS:-2}
      GASLESS_STUCK_TRANSACTION_SECONDS: ${GASLESS_STUCK_TRANSACTION_SECONDS:-120}
      CONFIRMATION_BLOCKS: ${CONFIRMATION_BLOCKS:-12}
      DATABASE_URL: "postgresql://claims:${POSTGRES_PASSWORD}@postgres:5432/claims_registry"
    depends_on:
      database-migrate:
        condition: service_completed_successfully
    volumes:
      - "${SEPOLIA_RELAYER_PRIVATE_KEY_HOST_FILE:?Set SEPOLIA_RELAYER_PRIVATE_KEY_HOST_FILE in .env.gcp}:/run/secrets/relayer.key:ro"
    stop_grace_period: 30s

  listener:
    <<: *python-service
    command: ["python", "-m", "apps.listener.claims_listener"]
    environment:
      <<: [*chain-read-environment, *kafka-environment]
      # The listener verifies public IPFS bytes and publishes Kafka events. It
      # cannot submit transactions because it receives no wallet private key.
      IPFS_GATEWAY: ${IPFS_GATEWAY:-https://gateway.pinata.cloud/ipfs}
      DATABASE_URL: "postgresql://claims:${POSTGRES_PASSWORD}@postgres:5432/claims_registry"
      LISTENER_STATE_DIR: ${LISTENER_STATE_DIR:-/var/lib/claims-listener}
      LISTENER_START_BLOCK: ${LISTENER_START_BLOCK:?Set LISTENER_START_BLOCK to the contract deployment block}
      POLL_INTERVAL: ${POLL_INTERVAL:-5}
      CONFIRMATION_BLOCKS: ${CONFIRMATION_BLOCKS:-12}
      MAX_BLOCK_RANGE: ${MAX_BLOCK_RANGE:-50}
      METRICS_PORT: "9101"
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      database-migrate:
        condition: service_completed_successfully
      listener-state-init:
        condition: service_completed_successfully
    volumes:
      - claims-listener-state:/var/lib/claims-listener
    ports:
      - "127.0.0.1:9101:9101"
    # The process can be running before its metrics server is ready to accept a
    # complete request. CD waits for this local endpoint instead of racing the
    # first post-deployment verification request.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9101/metrics', timeout=5)"
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s
    stop_grace_period: 30s

  scoring-worker:
    <<: *python-service
    command: ["python", "-m", "packages.integrations.kafka.scoring_worker"]
    environment:
      <<: [*chain-read-environment, *kafka-environment]
      DEPLOYMENT_ENVIRONMENT: production
      SEPOLIA_ASSESSOR_PRIVATE_KEY_FILE: /run/secrets/assessor.key
      IPFS_GATEWAY: ${IPFS_GATEWAY:-https://gateway.pinata.cloud/ipfs}
      DUPLICATE_FINGERPRINT_KEY: ${DUPLICATE_FINGERPRINT_KEY:?Set DUPLICATE_FINGERPRINT_KEY in .env.gcp}
      CLAIM_AUTHORIZATION_KEY: ${CLAIM_AUTHORIZATION_KEY:?Set CLAIM_AUTHORIZATION_KEY in .env.gcp}
      DATABASE_URL: "postgresql://claims:${POSTGRES_PASSWORD}@postgres:5432/claims_registry"
      XGBOOST_MODEL_DIR: ${XGBOOST_MODEL_DIR:-/opt/claims-model}
      XGBOOST_MODEL_SHA256: ${XGBOOST_MODEL_SHA256:-}
      # A permanent input rejection is fsync'd here before Kafka commits past
      # it. The named volume keeps that audit evidence across container rebuilds.
      SCORING_STATE_DIR: ${SCORING_STATE_DIR:-/var/lib/claims-scoring}
      METRICS_PORT: "9102"
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      database-migrate:
        condition: service_completed_successfully
      scoring-state-init:
        condition: service_completed_successfully
    volumes:
      # The model directory is never writable from inside the worker. This keeps
      # a reviewed artifact unchanged throughout an experimental run.
      - "${XGBOOST_MODEL_HOST_DIR:?Set XGBOOST_MODEL_HOST_DIR in .env.gcp}:/opt/claims-model:ro"
      # Keep dead-letter writes out of the read-only image and preserve them
      # independently from Kafka retention and container replacement.
      - claims-scoring-state:/var/lib/claims-scoring
      - "${SEPOLIA_ASSESSOR_PRIVATE_KEY_HOST_FILE:?Set SEPOLIA_ASSESSOR_PRIVATE_KEY_HOST_FILE in .env.gcp}:/run/secrets/assessor.key:ro"
    ports:
      - "127.0.0.1:9102:9102"
    # Model and integration initialization can outlive container creation. A
    # local-only health probe gives Compose a real readiness boundary while the
    # public firewall continues to expose no metrics port.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9102/metrics', timeout=5)"
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s
    stop_grace_period: 240s

  # kafka-exporter translates broker offsets and consumer-group lag into a small
  # Prometheus endpoint. Its filters reuse the application identity so the
  # dashboard cannot mix lag from another deployment. Only the VM's Ops Agent
  # can reach the bound host port.
  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.9.0
    restart: unless-stopped
    command:
      - --kafka.server=kafka:9092
      - --group.filter=${KAFKA_CONSUMER_GROUP_ID:-claims-registry-scorer-sepolia-public-intake-v1}
      - --topic.filter=${KAFKA_CLAIM_SUBMITTED_TOPIC:-claims.submitted.sepolia-public-intake-v1}
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:9308:9308"
    logging: *json-logging

  frontend:
    image: decentralized-claims-frontend:local
    build:
      context: ../..
      dockerfile: infrastructure/gcp/Dockerfile.frontend
      args:
        VITE_API_BASE_URL: /api
        VITE_IPFS_GATEWAY: ${IPFS_GATEWAY:-https://gateway.pinata.cloud/ipfs}
        VITE_PUBLIC_DEMO_READ_ONLY: ${PUBLIC_DEMO_READ_ONLY:-false}
        # The browser flag controls presentation only. FastAPI independently
        # enforces the matching server flag for every anonymous write.
        VITE_PUBLIC_PROTOTYPE_ASSESSOR: ${PUBLIC_PROTOTYPE_ASSESSOR:-false}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:?Set PUBLIC_HOST in .env.gcp}
    volumes:
      - claims-caddy-data:/data
      - claims-caddy-config:/config
    security_opt:
      - no-new-privileges:true
    logging: *json-logging

volumes:
  claims-postgres-data:
  claims-kafka-data:
  claims-listener-state:
  claims-scoring-state:
  claims-caddy-data:
  claims-caddy-config:
